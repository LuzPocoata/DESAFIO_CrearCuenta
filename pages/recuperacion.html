<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <img src="https://us.123rf.com/450wm/liudmilachernetska/liudmilachernetska2302/liudmilachernetska230204328/197832264-con-diferentes-mascotas-lindas-sobre-fondo-blanco.jpg?ver=6" alt="mascotas">
    <div class="contenedor">
        <h2>Recuperar Contraseña</h2>
        <form id="recuperacionForm">
            <input type="email" id="recuperacionCorreo" placeholder="Nombre de Usuario" required> 
            <div class="input-group">
                <input type="password" id="nuevaContrasena" placeholder="Nueva Contraseña" required>
                <span class="contra" id="ojoRecuperacion">👁️</span>
            </div>
            <button type="submit">Actualizar Contraseña</button>
        </form>
        <p id="mensajeRecuperacion"></p>
        <p><a id="enlaceVolverLogin" href="../pages/iniciosesion.html">Volver a Iniciar Sesión</a></p>
    </div>

    <script src="../js/main.js"></script>
</body>
</html>
